name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Regression tests
        run: ./tests/run.ps1
      - name: Generate preview
        run: ./scripts/render.ps1 -Preview
      - name: Verify generated bundle
        run: ./scripts/verify.ps1
      - name: Generate Copilot preview
        run: ./scripts/render.ps1 -Target Copilot -Preview
      - name: Verify Copilot bundle
        run: ./scripts/verify.ps1 -Bundle .local/build/copilot-preview
      - name: Package plugins
        run: ./scripts/package.ps1
      - name: Verify plugin distribution
        run: ./scripts/package.ps1 -VerifyOnly
      - name: Verify repository marketplace
        run: ./scripts/package.ps1 -Repository -VerifyOnly
